limit_req_zone $binary_remote_addr zone=learning_signup:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name learning.peebot.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learning.peebot.shop;

    ssl_certificate /etc/letsencrypt/live/peebot.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peebot.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1M;

    location ~ ^/api/(auth/(login|register)|link/start)$ {
        limit_req zone=learning_signup burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
