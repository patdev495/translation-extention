[project]
name = "polytranslate-learning-web"
version = "0.1.0"
description = "FastAPI backend for the PolyTranslate learning website"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.2,<1",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
